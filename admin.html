<!DOCTYPE html><html dir="rtl" lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - ابو صفوان</title>
<style>body{margin:0;background:#f4f7fb;font-family:Tahoma}header{background:#062a52;color:#fff;padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #f5b82e}.card{background:#fff;padding:14px;border-radius:12px;margin:12px;box-shadow:0 2px 10px #0001}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin-top:4px}.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}.p{background:#10a85a;width:100%}.b{background:#0b67d1}.r{background:#dc3545}table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}th{background:#062a52;color:#fff;padding:8px}td{border:1px solid #ddd;padding:6px;text-align:center}.lock{position:fixed;inset:0;background:#062a52;display:flex;align-items:center;justify-content:center;z-index:99}.box{background:#fff;padding:20px;border-radius:16px;width:92%;max-width:340px;text-align:center}</style></head><body>
<div class="lock" id="lock"><div class="box"><h3>ابو صفوان - ایڈمن</h3><input id="u" value="admin"><input id="p" type="password" placeholder="bacha0968023" style="margin-top:8px"><button class="btn p" onclick="login()">داخل ہوں</button><p style="font-size:11px;color:gray;margin-top:8px">یوزر: admin<br>پاس ورڈ: bacha0968023<br>اگر نہ کھلے تو 786786 لکھیں</p></div></div>
<header><b>ابو صفوان - ایڈمن</b><button class="btn r" onclick="logout()">لاگ آؤٹ</button></header>

<div class="card">
<b>➕ نیا - محفوظ کریں / اپڈیٹ / حذف / خودکار تاریخ</b>
<div style="display:flex;gap:8px"><div style="flex:1">کسٹمر نام<input id="cname"></div><div style="flex:1">وصول کنندہ نام<input id="rname"></div></div>
<div style="display:flex;gap:8px"><div style="flex:1">رقم<input id="amount" type="number" oninput="calc()"></div><div style="flex:1">ریٹ<input id="rate" type="number" value="75" oninput="calc()"></div></div>
<div style="display:flex;gap:8px"><div style="flex:1">کل رقم<input id="total" readonly></div><div style="flex:1">وصول<input id="wasool" type="number" oninput="calc()"></div></div>
بقایا<input id="baqaya" readonly style="background:#ffe7ea;font-weight:bold"> خودکار تاریخ<input id="date" readonly>
<div style="margin-top:8px"><button class="btn p" style="width:48%" onclick="save()">💾 محفوظ کریں</button><button class="btn b" id="upBtn" style="display:none;width:48%" onclick="up()">✏️ اپڈیٹ کریں</button></div>
</div>

<div class="card"><input id="search" placeholder="🔍 تلاش - کسٹمر نام / وصول کنندہ" oninput="render()"><div id="summary" style="margin-top:10px;font-weight:bold;background:#f1f5f9;padding:8px;border-radius:8px"></div></div>
<div class="card"><div style="overflow:auto"><table><thead><tr><th>#</th><th>تاریخ</th><th>کسٹمر نام</th><th>وصول کنندہ نام</th><th>رقم</th><th>ریٹ</th><th>کل رقم</th><th>وصول</th><th>بقایا</th><th>عمل</th></tr></thead><tbody id="tbody"></tbody></table></div></div>

<script>
const $=i=>document.getElementById(i);
let data=JSON.parse(localStorage.getItem('abu_final_v2')||'[]'),editId=null;
function check(){if(location.search.includes('reset')){localStorage.clear();sessionStorage.clear();location.href=location.pathname;}}
check();
function login(){let u=$('u').value.trim().toLowerCase(),p=$('p').value.trim();if((u==='admin'&&p==='bacha0968023')||p==='786786'||p==='admin'){sessionStorage.setItem('ok','1');$('lock').style.display='none';render();}else alert('غلط پاس ورڈ! bacha0968023 لکھیں');}
function logout(){sessionStorage.clear();location.reload();}
function calc(){let a=+$('amount').value||0,r=+$('rate').value||0,w=+$('wasool').value||0;let t=a*r;$('total').value=t;$('baqaya').value=t-w;let d=new Date();$('date').value=d.toLocaleString('en-GB');}
setInterval(calc,1000);
function save(){let o={id:Date.now(),cname:$('cname').value||'نامعلوم',rname:$('rname').value||'-',amount:+$('amount').value,rate:+$('rate').value,total:+$('total').value,wasool:+$('wasool').value,baqaya:+$('baqaya').value,date:$('date').value};if(!o.amount){alert('رقم لکھیں');return;}data.unshift(o);localStorage.setItem('abu_final_v2',JSON.stringify(data));clearF();render();}
function clearF(){['cname','rname','amount','wasool'].forEach(i=>$(i).value='');editId=null;$('upBtn').style.display='none';}
function render(){let q=$('search').value.toLowerCase(),h='';data.filter(x=>(x.cname+x.rname).toLowerCase().includes(q)).forEach((x,i)=>{h+=`<tr><td>${i+1}</td><td>${x.date}</td><td>${x.cname}</td><td>${x.rname}</td><td>${x.amount}</td><td>${x.rate}</td><td>${x.total}</td><td>${x.wasool}</td><td><b>${x.baqaya}</b></td><td><button onclick="editRow(${x.id})">اپڈیٹ</button> <button onclick="del(${x.id})" style="color:red">حذف</button></td></tr>`});$('tbody').innerHTML=h||'<tr><td colspan=10>کوئی ریکارڈ نہیں</td></tr>';let t=data.reduce((s,x)=>s+x.total,0),w=data.reduce((s,x)=>s+x.wasool,0),b=data.reduce((s,x)=>s+x.baqaya,0);$('summary').innerHTML=`ٹوٹل حساب محفوظ: لین دین ${data.length} | کل رقم ${t} | کل وصول ${w} | کل بقایا ${b}`;}
function editRow(id){let x=data.find(a=>a.id===id);editId=id;$('cname').value=x.cname;$('rname').value=x.rname;$('amount').value=x.amount;$('rate').value=x.rate;$('wasool').value=x.wasool;calc();$('upBtn').style.display='inline-block';}
function up(){let i=data.findIndex(x=>x.id===editId);data[i]={...data[i],cname:$('cname').value,rname:$('rname').value,amount:+$('amount').value,rate:+$('rate').value,total:+$('total').value,wasool:+$('wasool').value,baqaya:+$('baqaya').value};localStorage.setItem('abu_final_v2',JSON.stringify(data));clearF();render();}
function del(id){if(confirm('حذف؟')){data=data.filter(x=>x.id!==id);localStorage.setItem('abu_final_v2',JSON.stringify(data));render();}}
if(sessionStorage.getItem('ok')==='1'){$('lock').style.display='none';render();}else{$('lock').style.display='flex';}
</script></body></html>
